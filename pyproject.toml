[project]
name = "privacy-proxy"
version = "0.1.0"
description = "Presidio 기반 LLM 프롬프트 개인정보 가명화 프록시"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "httpx>=0.28",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "redis>=5.2",
    "cryptography>=44.0",
    # l4/recognizers/가 전화번호 배제에 쓴다(L3와 동일 방식). presidio-analyzer(detection
    # extra)의 전이 의존성으로 이미 lock엔 있었지만, recognizers는 extra 없이 단독으로
    # 돌아야 하므로(torch 불필요) 직접 의존성으로 명시한다.
    "phonenumbers>=9.0",
]

# 탐지 계층(L3/L4)은 모델 의존성이 무겁다(torch, spacy, transformers).
# 프록시 뼈대만 돌릴 때는 설치하지 않아도 되도록 extra로 분리한다.
#   uv sync --extra detection
[project.optional-dependencies]
detection = [
    "presidio-analyzer>=2.2",
    "presidio-anonymizer>=2.2",
    "spacy>=3.8",
    "transformers>=4.48",
    "torch>=2.5",
]

# L4 NER 학습 전용. 런타임 추론에는 필요 없어서 detection과 분리한다.
#   uv sync --extra training
training = [
    "transformers>=4.48",
    "torch>=2.5",
    "datasets>=3.2",
    "seqeval>=1.2",
    "accelerate>=1.3",
    "matplotlib>=3.10",
    "pandas>=2.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pytest-asyncio>=0.25",
    "mypy>=1.15",
    # .pre-commit-config.yaml의 ruff rev와 맞춰둔다. 버전이 벌어지면
    # 로컬 `ruff check`는 통과하는데 커밋 훅에서 막히는 일이 생긴다.
    "ruff>=0.16.5",
    "pre-commit>=4.1",
    "types-redis>=4.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/privacy_proxy", "src/audit", "src/restore", "src/upstream"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "l4", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "S", "C4", "SIM", "RUF"]
# S101: 테스트의 assert는 정상이다 (per-file-ignores에서 다시 허용).
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# S101: 테스트의 assert는 정상.
# N802: 한글 테스트 함수명은 str.islower()가 항상 False라 무조건 걸린다.
#       BIO 경계 규칙처럼 미묘한 도메인 규칙은 한글 이름이 훨씬 잘 읽혀서 허용한다.
"tests/**" = ["S101", "N802"]
# 노트북은 셀 단위로 위에서 아래로 읽는 문서다. 라이브러리 기준을 그대로 대면
# 오히려 읽기 나빠진다. 관용구에 해당하는 것만 푼다.
#   E402 셀 중간 import / S101 가드용 assert / F811 셀 간 재정의
#   S603,S607 nvidia-smi·git 호출
"*.ipynb" = ["E402", "S101", "F811", "S603", "S607"]

[tool.mypy]
python_version = "3.11"
files = ["src", "l4"]
strict = true
# presidio, spacy, transformers는 타입 스텁을 제공하지 않는다.
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q --strict-markers"
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src/privacy_proxy"]
branch = true
