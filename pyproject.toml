[project]
name = "privacy-proxy"
version = "0.1.0"
description = "Presidio 기반 LLM 프롬프트 개인정보 가명화 프록시"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "httpx>=0.28",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "redis>=5.2",
    "cryptography>=44.0",
]

# 탐지 계층(L3/L4)은 모델 의존성이 무겁다(torch, spacy, transformers).
# 프록시 뼈대만 돌릴 때는 설치하지 않아도 되도록 extra로 분리한다.
#   uv sync --extra detection
[project.optional-dependencies]
detection = [
    "presidio-analyzer>=2.2",
    "presidio-anonymizer>=2.2",
    "spacy>=3.8",
    "transformers>=4.48",
    "torch>=2.5",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pytest-asyncio>=0.25",
    "mypy>=1.15",
    "ruff>=0.9.6",
    "pre-commit>=4.1",
    "types-redis>=4.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/privacy_proxy"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "S", "C4", "SIM", "RUF"]
# S101: 테스트의 assert는 정상이다 (per-file-ignores에서 다시 허용).
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
strict = true
# presidio, spacy, transformers는 타입 스텁을 제공하지 않는다.
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src/privacy_proxy"]
branch = true
