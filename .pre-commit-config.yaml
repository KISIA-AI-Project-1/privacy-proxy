# 훅 등록은 `pre-commit install`이 아니라 core.hooksPath로 한다.
#   git config core.hooksPath .githooks
# .githooks/pre-commit, .githooks/pre-push가 이 설정을 호출한다.
#
# rev 값은 초기 기준점이다. 주기적으로 갱신할 것:
#   uv run pre-commit autoupdate
#
# 훅 스크립트(.githooks/*)는 반드시 실행 권한이 있어야 한다. 없으면 git이
# 경고만 남기고 훅을 통째로 건너뛴다. 권한이 풀리면:
#   git update-index --chmod=+x .githooks/pre-commit .githooks/pre-push

default_stages: [pre-commit]

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.6
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.0
    hooks:
      - id: gitleaks

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.15.0
    hooks:
      - id: mypy
        files: ^(src|l4)/
        # mypy 훅은 격리된 환경에서 돈다. 여기 없는 패키지는 import를 못 찾는다.
        # presidio/spacy/transformers는 스텁이 없어 pyproject의
        # ignore_missing_imports=true로 넘긴다.
        additional_dependencies:
          - pydantic
          - pydantic-settings
          - types-redis
          - fastapi
          - httpx

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: detect-private-key
      - id: check-added-large-files
        # uv.lock은 650KB 정도로 기본 한도(500KB)를 넘지만 반드시 커밋해야 한다.
        # 한도 자체를 올리면 모델 가중치·데이터 덤프가 새어 들어올 여지가 생기므로
        # 이 파일만 예외로 둔다.
        exclude: ^uv\.lock$
      - id: check-merge-conflict
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: local
    hooks:
      # 테스트는 커밋마다 돌리기엔 느려서 push 시점에만 실행한다.
      - id: pytest-cov
        name: pytest (coverage)
        entry: uv run pytest --cov=src/privacy_proxy --cov-report=term-missing
        language: system
        types: [python]
        pass_filenames: false
        stages: [pre-push]
